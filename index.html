<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>旅行灵感罗盘</title>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
<style>
:root{
  --bg:#F5F5FB;
  --surface:#FFFFFF;
  --ink:#1F2133;
  --muted:#6E7186;
  --line:#E6E5F2;
  --line-strong:#D7D6EA;
  --primary:#5B57D8;
  --primary-deep:#3A37A6;
  --accent:#8B5CF6;
  --tint:#F2F1FA;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.65;font-size:14px;
}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}

/* ---------- header ---------- */
.app-header{
  background:
    linear-gradient(120deg,rgba(30,30,94,.82),rgba(91,87,216,.62)),
    url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=80")
    center / cover no-repeat,
    var(--primary-deep);
  color:#fff;padding:28px 0 30px;
}
.brand-row{display:flex;align-items:center;gap:16px;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand-mark{
  width:46px;height:46px;flex:0 0 46px;border-radius:8px;
  background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;
}
.brand-mark svg{width:24px;height:24px}
.brand h1{font-size:22px;font-weight:700;letter-spacing:0}
.brand .tagline{font-size:13px;color:rgba(255,255,255,.78);margin-top:2px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border-radius:8px;padding:10px 18px;font-weight:600;font-size:14px;
  transition:transform .12s ease,box-shadow .12s ease,background .12s ease;
  white-space:nowrap;
}
.btn svg{width:16px;height:16px}
.btn:active{transform:scale(.97)}
.btn-light{background:#fff;color:var(--primary-deep)}
.btn-light:hover{box-shadow:0 6px 16px rgba(0,0,0,.18)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:#4A45C7}
.btn-ghost{border:1px solid var(--line-strong);background:#fff;color:var(--ink)}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
/* ---------- query bar ---------- */
main{padding:16px 0 8px}
.query-bar{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--line);border-radius:8px;
  padding:10px 12px;box-shadow:0 8px 20px rgba(31,33,51,.06);
}
.q-group{display:flex;align-items:center;gap:8px}
.q-label{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:var(--muted)}
.q-label svg{width:14px;height:14px;color:var(--primary)}
.query-bar .btn{padding:7px 16px;height:32px}
.query-control{display:inline-flex;align-items:center;gap:6px}
.step-btn{
  width:32px;height:32px;border:1px solid var(--line);border-radius:8px;background:#fff;
  display:inline-flex;align-items:center;justify-content:center;color:var(--muted);
  transition:border-color .12s ease,color .12s ease;
}
.step-btn:hover{border-color:var(--primary);color:var(--primary)}
.step-btn svg{width:14px;height:14px}
.num-input{
  width:64px;height:32px;text-align:center;border:1px solid var(--line);border-radius:8px;
  font-size:14px;font-weight:700;color:var(--ink);background:#fff;
}
.num-input:focus{outline:2px solid var(--primary);outline-offset:1px;border-color:var(--primary)}
.num-input::-webkit-outer-spin-button,.num-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.num-input{-moz-appearance:textfield;appearance:textfield}
.unit{font-size:13px;font-weight:600;color:var(--muted);margin-right:2px}
.mood-select{
  height:32px;border:1px solid var(--line);border-radius:8px;padding:0 10px;
  font-size:13.5px;font-weight:600;background:#fff;color:var(--ink);min-width:210px;
}
.mood-select:focus{outline:2px solid var(--primary);outline-offset:1px;border-color:var(--primary)}
.query-bar .count-pill{margin-left:auto}

/* ---------- results ---------- */
.result-head{
  display:flex;align-items:flex-end;justify-content:space-between;gap:14px;
  margin:18px 2px 14px;flex-wrap:wrap;
}
.result-head h2{font-size:19px;font-weight:700;letter-spacing:0}
.result-head .sub{font-size:13px;color:var(--muted);margin-top:2px}
.count-pill{
  background:var(--tint);border-radius:999px;padding:5px 13px;
  font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap;
}
.count-pill b{color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;padding-bottom:8px}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:8px;
  padding:16px 16px 14px;display:flex;flex-direction:column;gap:10px;
  border-top:3px solid var(--acc,var(--primary));
  transition:transform .14s ease,box-shadow .14s ease,border-color .14s ease;
  cursor:pointer;
}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(31,33,51,.08);border-color:var(--line-strong)}
.card:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.card h3{font-size:17px;font-weight:700;line-height:1.35}
.region{font-size:12.5px;color:var(--muted);margin-top:1px}
.badge{flex:none;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 10px}
.badge.hot{background:#EDE9FD;color:#6639C7}
.badge.soft{background:#F0EFEA;color:var(--muted)}
.desc{font-size:13.5px;color:var(--ink)}
.reason{
  display:flex;gap:8px;align-items:flex-start;background:var(--tint);
  border-left:3px solid var(--accent);border-radius:6px;padding:9px 11px;
  font-size:12.5px;color:#57606A;line-height:1.55;
}
.reason svg{width:14px;height:14px;flex:none;color:var(--accent);margin-top:3px}
.meta{display:flex;flex-direction:column;gap:6px;margin-top:auto;padding-top:2px}
.meta-row{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.meta-row svg{width:14px;height:14px;flex:none}
.pill-row{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:11px;font-weight:600;border-radius:999px;padding:2px 9px}
.pill-relax{background:#E7F3EC;color:#1E6B45}
.pill-heal{background:#E3F2F0;color:#0F6B62}
.pill-romance{background:#FBE7EC;color:#B0325B}
.pill-adventure{background:#FDEEE0;color:#A4530F}
.pill-food{background:#FBE9E7;color:#B3271A}
.pill-culture{background:#FBF3DE;color:#8A5B0C}
.pill-family{background:#E7F0FB;color:#1E5AA8}
.pill-photo{background:#EFEAFB;color:#5B3FA8}
.pill-shopping{background:#F9E8F5;color:#A02A85}
.empty{
  grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 10px;
  background:var(--surface);border:1px dashed var(--line-strong);border-radius:8px;
}

/* ---------- lucky dialog ---------- */
dialog{
  position:fixed;inset:0;margin:auto;height:fit-content;max-height:calc(100vh - 40px);overflow:auto;
  border:none;border-radius:8px;padding:0;width:min(440px,calc(100vw - 40px));
  box-shadow:0 24px 60px rgba(15,25,30,.3);
}
dialog::backdrop{background:rgba(20,24,28,.48)}
.lucky{padding:22px 22px 20px;display:flex;flex-direction:column;gap:12px;border-top:5px solid var(--accent)}
.lucky-top{display:flex;align-items:center;justify-content:space-between}
.lucky-kicker{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.08em}
.icon-btn{
  width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  color:var(--muted);transition:background .12s ease,color .12s ease;
}
.icon-btn:hover{background:var(--tint);color:var(--ink)}
.icon-btn svg{width:16px;height:16px}
.lucky h3{font-size:24px;font-weight:800;line-height:1.3}
.lucky .desc{font-size:14px}
.lucky-meta{display:flex;flex-direction:column;gap:8px;background:var(--tint);border-radius:8px;padding:12px 14px}
.lucky-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:2px}
.poster{padding:18px;display:flex;flex-direction:column;gap:14px;border-top:5px solid var(--accent)}
.poster-frame{border-radius:8px;overflow:hidden;background:#15164D;box-shadow:0 10px 26px rgba(31,33,51,.18)}
#posterImage{display:block;width:100%;height:auto}
.poster-actions{display:flex;gap:10px;justify-content:flex-end}

footer{padding:26px 0 34px;text-align:center;font-size:12px;color:var(--muted)}

@media (max-width:640px){
  .app-header{padding:22px 0 26px}
  .brand-row{flex-direction:column;align-items:stretch}
  .brand-mark{width:42px;height:42px;flex-basis:42px}
  .btn-light{width:100%}
  .cards{grid-template-columns:1fr}
  .query-bar{padding:8px;gap:8px}
  .q-group{width:100%}
  .q-label{width:58px;flex:0 0 58px}
  .query-control{flex:1;justify-content:flex-start}
  .query-bar .btn{width:100%}
  .mood-select{flex:1;min-width:0}
  .query-bar .count-pill{margin-left:0;width:100%;text-align:center}
}
@media (max-width:420px){
  .lucky-actions{flex-direction:column}
  .lucky-actions .btn{width:100%}
  .poster-actions{flex-direction:column}
  .poster-actions .btn{width:100%}
}
</style>
</head>
<body>

<header class="app-header">
  <div class="wrap">
    <div class="brand-row">
      <div class="brand">
        <div class="brand-mark"><i data-lucide="compass" aria-hidden="true"></i></div>
        <div>
          <h1>旅行灵感罗盘</h1>
          <p class="tagline">月份、心情、假期一起匹配，直接告诉你去哪儿</p>
        </div>
      </div>
      <button class="btn btn-light" id="luckyBtn"><i data-lucide="dices" aria-hidden="true"></i>手气目的地</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="query-bar">
    <div class="q-group">
      <span class="q-label"><i data-lucide="calendar-days" aria-hidden="true"></i>月份</span>
      <div class="query-control">
        <button class="step-btn" data-target="month" data-dir="-1" aria-label="上一个月"><i data-lucide="minus" aria-hidden="true"></i></button>
        <input class="num-input" id="monthInput" type="number" inputmode="numeric" min="1" max="12" aria-label="出行月份">
        <span class="unit">月</span>
        <button class="step-btn" data-target="month" data-dir="1" aria-label="下一个月"><i data-lucide="plus" aria-hidden="true"></i></button>
      </div>
    </div>
    <div class="q-group">
      <span class="q-label"><i data-lucide="heart" aria-hidden="true"></i>心情</span>
      <div class="query-control">
        <select class="mood-select" id="moodSelect" aria-label="旅行心情">
          <option value="">不限心情</option>
        </select>
      </div>
    </div>
    <div class="q-group">
      <span class="q-label"><i data-lucide="clock" aria-hidden="true"></i>假期</span>
      <div class="query-control">
        <button class="step-btn" data-target="days" data-dir="-1" aria-label="减少一天"><i data-lucide="minus" aria-hidden="true"></i></button>
        <input class="num-input" id="daysInput" type="number" inputmode="numeric" min="1" max="30" aria-label="假期天数">
        <span class="unit">天</span>
        <button class="step-btn" data-target="days" data-dir="1" aria-label="增加一天"><i data-lucide="plus" aria-hidden="true"></i></button>
      </div>
    </div>
    <button class="btn btn-primary" id="goBtn"><i data-lucide="sparkles" aria-hidden="true"></i>马上推荐</button>
    <span class="count-pill" id="resultCount"></span>
  </div>

  <section class="results" id="results" aria-live="polite">
    <div class="result-head">
      <div>
        <h2 id="resultTitle"></h2>
        <p class="sub" id="resultSub"></p>
      </div>
    </div>
    <div class="cards" id="resultCards"></div>
  </section>
</main>

<footer>纯娱乐版：推荐与心灵寄语仅供旅行灵感参考，出行前请自行确认天气、开放时间与签证政策。</footer>

<dialog id="luckyDialog" aria-labelledby="luckyTitle">
  <div class="lucky">
    <div class="lucky-top">
      <span class="lucky-kicker">今日手气</span>
      <button class="icon-btn" id="luckyClose" aria-label="关闭"><i data-lucide="x" aria-hidden="true"></i></button>
    </div>
    <h3 id="luckyTitle"></h3>
    <p class="region" id="luckyRegion"></p>
    <p class="desc" id="luckyDesc"></p>
    <div class="lucky-meta" id="luckyMeta"></div>
    <div class="lucky-actions">
      <button class="btn btn-ghost" id="luckyAgain"><i data-lucide="dices" aria-hidden="true"></i>再来一次</button>
      <button class="btn btn-primary" id="luckyOk"><i data-lucide="image" aria-hidden="true"></i>收下这个灵感</button>
    </div>
  </div>
</dialog>

<dialog id="posterDialog" aria-labelledby="posterDialogTitle">
  <div class="poster">
    <div class="lucky-top">
      <span class="lucky-kicker" id="posterDialogTitle">灵感卡片</span>
      <button class="icon-btn" id="posterClose" aria-label="关闭"><i data-lucide="x" aria-hidden="true"></i></button>
    </div>
    <div class="poster-frame">
      <img id="posterImage" alt="旅行灵感图片">
    </div>
    <div class="poster-actions">
      <button class="btn btn-ghost" id="posterBack"><i data-lucide="arrow-left" aria-hidden="true"></i>返回</button>
      <button class="btn btn-primary" id="posterDownload"><i data-lucide="download" aria-hidden="true"></i>保存图片</button>
    </div>
  </div>
</dialog>

<script>
"use strict";

const MOODS = {
  relax:    {label:"放松",  icon:"armchair",    sub:"躺平充电，什么都不想"},
  heal:     {label:"疗愈",  icon:"sprout",      sub:"离开内耗，把自己找回来"},

const MOOD_QUOTES = {

// n=名称 r=地区 a=国内/出境 m=最佳月份 p=峰值月 md=心情(首位为主心情) d=建议天数 x=一句话 s=季节理由 c=节奏理由
const DESTS = [
  {n:"哈尔滨",r:"黑龙江 · 国内",a:"国内",m:[12,1,2],p:[1],md:["photo","family","adventure"],d:[3,4],x:"冰雪大世界、中央大街，零下二十度的浪漫。",s:"冰雪大世界开放，整座城市就是冰与灯的童话。",c:"市区景点集中，3-4天可顺路加上雪乡或亚布力。"},
  {n:"漠河",r:"黑龙江 · 国内",a:"国内",m:[12,1,2],p:[12],md:["adventure","photo"],d:[3,4],x:"找北之旅：白桦林、驯鹿与泼水成冰。",s:"极寒限定体验，运气好还能遇见极光。",c:"火车或飞机中转加包县游玩，3-4天刚好。"},

  {n:"北京",r:"国内",a:"国内",m:[3,4,5,9,10,11],p:[10,11],md:["culture","food","photo"],d:[3,4],x:"故宫红墙、胡同鸽哨与秋日香山。",s:"秋天银杏红叶铺满城，春天柳绿花明。",c:"中轴线两天，加长城和颐和园三天起步。"},
  {n:"西安",r:"陕西 · 国内",a:"国内",m:[3,4,5,9,10,11],p:[4,10],md:["culture","food"],d:[3,4],x:"兵马俑与城墙之下，碳水之都日夜飘香。",s:"春秋温度舒适，适合暴走刷馆。",c:"市区两天加兵马俑一天，三天是标准答案。"},
  {n:"杭州",r:"浙江 · 国内",a:"国内",m:[3,4,5,9,10,11],p:[3,4],md:["relax","romance","photo"],d:[2,3],x:"西湖春晓、龙井茶园，江南的温柔本身。",s:"春有苏堤春晓，秋有满陇桂雨。",c:"环湖加灵隐两三天，节奏可以很慢。"},

function fmtMonths(months){
  const a = [...new Set(months)].sort((x,y)=>x-y);
  const parts = []; let s = a[0], prev = a[0];
  for (let i=1;i<=a.length;i++){
    if (a[i]===prev+1){ prev=a[i]; continue; }
    parts.push(s===prev ? `${s}月` : `${s}-${prev}月`);
    s = prev = a[i];
  }
  return parts.join("、");
}
function fmtDays(d){
  if (d[0]>=8) return `${d[0]}天以上`;
  return d[0]===d[1] ? `${d[0]}天` : `${d[0]}-${d[1]}天`;
}

const FONT_STACK = `"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif`;
function quoteFor(d){
  const list = MOOD_QUOTES[d.md[0]] || MOOD_QUOTES.relax;
  const seed = [...d.n].reduce((sum,c)=>sum+c.codePointAt(0),0);
  return list[seed % list.length];
}
function blessingFor(d){
  const seed = [...d.n].reduce((sum,c)=>sum+c.codePointAt(0),0);
  return TRAVEL_BLESSINGS[(seed + new Date().getDate()) % TRAVEL_BLESSINGS.length];
}
function posterDate(){
  try { return new Intl.DateTimeFormat("zh-CN",{month:"long",day:"numeric"}).format(new Date()); }
  catch(e){ return `${new Date().getMonth()+1}月${new Date().getDate()}日`; }
}
function wrapText(ctx,text,maxWidth,maxLines){
  const lines=[]; let line="";
  for(const ch of String(text)){
    if(line && ctx.measureText(line+ch).width>maxWidth){
      lines.push(line); line=ch;
    } else line += ch;
  }
  if(line) lines.push(line);
  if(lines.length>maxLines){
    lines.length=maxLines;
    let last=lines[maxLines-1];
    while(last.length>1 && ctx.measureText(last+"...").width>maxWidth) last=last.slice(0,-1);
    lines[maxLines-1]=last+"...";
  }
  return lines;
}
function drawTextBlock(ctx,text,x,y,maxWidth,lineHeight,maxLines,font,color){
  ctx.font=font; ctx.fillStyle=color; ctx.textAlign="left"; ctx.textBaseline="alphabetic";
  const lines=wrapText(ctx,text,maxWidth,maxLines);
  lines.forEach((row,i)=>ctx.fillText(row,x,y+i*lineHeight));
  return y+lineHeight*lines.length;
}
function roundedRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function makePosterURL(d){
  const W=1080,H=1440,x=92,w=896;
  const canvas=document.createElement("canvas");
  canvas.width=W; canvas.height=H;
  const ctx=canvas.getContext("2d");
  if(!ctx) return "";

  const bg=ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,"#15164D"); bg.addColorStop(.52,"#3A37A6"); bg.addColorStop(1,"#7C4FD8");
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  let seed=[...d.n].reduce((sum,c)=>sum+c.codePointAt(0),7);
  const rnd=()=>{ seed=(seed*9301+49297)%233280; return seed/233280; };
  for(let i=0;i<72;i++){
    const sx=rnd()*W, sy=rnd()*780, r=.8+rnd()*2.1;
    ctx.globalAlpha=.10+rnd()*.32; ctx.fillStyle="#FFFFFF";
    ctx.beginPath(); ctx.arc(sx,sy,r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1; ctx.lineCap="round";
  for(let i=0;i<9;i++){
    const cy=720+i*84;
    ctx.globalAlpha=.055+i*.006; ctx.strokeStyle="#FFFFFF"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(-40,cy);
    ctx.bezierCurveTo(250,cy-82,620,cy+72,1120,cy-30);
    ctx.stroke();
  }
  ctx.globalAlpha=1;

  drawTextBlock(ctx,"TRAVEL INSPIRATION · 今日手气",x,116,w,26,1,`700 25px ${FONT_STACK}`,"#D8CCFF");
  let y=drawTextBlock(ctx,d.n,x,212,w,82,2,`800 74px ${FONT_STACK}`,"#FFFFFF");
  y=drawTextBlock(ctx,d.r,x,Math.max(y+8,282),w,40,1,`600 28px ${FONT_STACK}`,"#D8CCFF");
  y=drawTextBlock(ctx,d.x,x,Math.max(y+48,340),w,50,2,`400 30px ${FONT_STACK}`,"rgba(255,255,255,.90)");

  const meta=[
    ["最佳月份",fmtMonths(d.m)],
    ["建议停留",fmtDays(d.d)],
    ["旅行心情",d.md.map(k=>MOODS[k].label).join(" / ")]
  ];
  let metaY=Math.max(y+62,556);
  meta.forEach(([label,value],i)=>{
    const rowY=metaY+i*64;
    ctx.textAlign="left"; ctx.textBaseline="alphabetic";
    ctx.font=`500 24px ${FONT_STACK}`; ctx.fillStyle="#C4B9F8";
    ctx.fillText(label,x,rowY);
    ctx.font=`650 29px ${FONT_STACK}`; ctx.fillStyle="#FFFFFF";
    ctx.fillText(value,x+142,rowY);
  });

  roundedRect(ctx,90,850,900,430,28);
  ctx.fillStyle="rgba(255,255,255,.13)"; ctx.fill();
  ctx.strokeStyle="rgba(255,255,255,.34)"; ctx.lineWidth=2; ctx.stroke();
  drawTextBlock(ctx,"心灵寄语",142,920,806,28,1,`700 26px ${FONT_STACK}`,"#E9DFFB");
  const quoteEnd=drawTextBlock(ctx,quoteFor(d),142,994,796,70,3,`700 45px ${FONT_STACK}`,"#FFFFFF");
  const blessingY=Math.max(quoteEnd+38,1170);
  ctx.strokeStyle="rgba(255,255,255,.22)"; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(142,blessingY-36); ctx.lineTo(938,blessingY-36); ctx.stroke();
  drawTextBlock(ctx,blessingFor(d),142,blessingY,796,44,2,`400 29px ${FONT_STACK}`,"#E9DFFB");

  ctx.textAlign="center"; ctx.textBaseline="alphabetic";
  ctx.font=`600 24px ${FONT_STACK}`; ctx.fillStyle="rgba(255,255,255,.78)";
  ctx.fillText(`${posterDate()} · 旅行灵感罗盘`,W/2,1376);
  return canvas.toDataURL("image/png");
}
function showPoster(d, source="card"){
  const url=makePosterURL(d);
  if(!url){ window.alert("当前浏览器暂时不能生成图片"); return; }
  posterD=d;
  posterSource=source;
  posterURL=url;
  $("#posterImage").src=url;
  $("#posterImage").alt=`${d.n}旅行灵感图片`;
  refreshIcons();
  return true;
}
function downloadPoster(){
  if(!posterURL || !posterD) return;
  const safeName=posterD.n.replace(/[\\/:*?"<>|]/g,"").replace(/\s+/g," ");
  const link=document.createElement("a");
  link.href=posterURL;
  link.download=`旅行灵感-${safeName}.png`;
  document.body.appendChild(link);
  link.click();
  link.remove();
}

/* ---------- combined scoring ---------- */
function scoreFor(d){
  const mo = d.p.includes(state.month) ? 3 : d.m.includes(state.month) ? 2 : 0;
  const g = state.mood ? (d.md[0]===state.mood ? 3 : d.md.includes(state.mood) ? 2 : 0) : 0;
  const dy = state.days>=d.d[0] && state.days<=d.d[1] ? 3
          : state.days>d.d[1] ? 2
          : d.d[0]-state.days<=2 ? 1 : 0;
  return {t:mo+g+dy, mo, g, dy};
}
function recommend(){
  const maxPts = state.mood ? 9 : 6;
  return DESTS.map(d=>({d, s:scoreFor(d)}))
    .sort((a,b)=> b.s.t-a.s.t || b.s.mo-a.s.mo || b.s.dy-a.s.dy)
    .slice(0,9)
    .map(x=>({d:x.d, s:x.s, pct:Math.round(x.s.t/maxPts*20)*5}));
}

/* ---------- card rendering ---------- */
function reasonFor(d){
  const pts = [];
  const m = state.month;
  if(d.p.includes(m)) pts.push(`${m}月正是最佳时节`);
  else if(d.m.includes(m)) pts.push(`${m}月气候合适`);
  const k = state.mood;
  if(k){
    if(d.md[0]===k) pts.push(`「${MOODS[k].label}」是这里的招牌体验`);
    else if(d.md.includes(k)) pts.push(`也很适合「${MOODS[k].label}」`);
  }
  const n = state.days;
  if(n>=d.d[0] && n<=d.d[1]) pts.push(`${n}天节奏刚好`);
  else if(n>d.d[1]) pts.push(`${n}天可以玩得更从容`);
  else if(d.d[0]-n<=2) pts.push(`行程会比理想紧${d.d[0]-n}天`);
  if(!pts.length) pts.push("作为这个组合的备选灵感");
  return pts.join("；");
}
function cardHTML(d, pct, top){
  const pills = d.md.map(k=>`<span class="pill pill-${k}">${MOODS[k].label}</span>`).join("");
  const badge = top
    ? '<span class="badge hot">综合推荐</span>'
    : `<span class="badge ${pct>=70?"hot":"soft"}">${pct}% 匹配</span>`;
  return `
  <article class="card" style="--acc:${MOOD_COLOR[d.md[0]]}" data-name="${d.n}" tabindex="0" role="button" aria-label="生成${d.n}旅行灵感图片">
    <div class="card-top">
      <div><h3>${d.n}</h3><p class="region">${d.r}</p></div>
      ${badge}
    </div>
    <p class="desc">${d.x}</p>
    <div class="reason"><i data-lucide="sparkles" aria-hidden="true"></i><span>匹配点：${reasonFor(d)}</span></div>
    <div class="meta">
      <div class="meta-row"><i data-lucide="calendar-days" aria-hidden="true"></i>最佳月份：${fmtMonths(d.m)}</div>
      <div class="meta-row"><i data-lucide="clock" aria-hidden="true"></i>建议停留：${fmtDays(d.d)}</div>
      <div class="pill-row">${pills}</div>
    </div>
  </article>`;
}
/* ---------- unified rendering ---------- */
function render(scroll){
  $("#monthInput").value = state.month;
  $("#daysInput").value = state.days;

  const list = recommend();
  const moodLabel = state.mood ? MOODS[state.mood].label : "心情不限";
  $("#resultTitle").textContent = `${state.month}月 · ${moodLabel} · ${state.days}天假`;
  $("#resultSub").textContent = "综合月份、心情与假期节奏排序，第一个是最佳匹配";
  $("#resultCount").innerHTML = `前 <b>${list.length}</b> 个匹配`;
  $("#resultCards").innerHTML = list.map((x,i)=>cardHTML(x.d,x.pct,i===0)).join("");
  refreshIcons();
  if(scroll) $("#results").scrollIntoView({behavior:"smooth",block:"start"});
}

function buildMoodOptions(){
  $("#moodSelect").insertAdjacentHTML("beforeend",
    Object.entries(MOODS).map(([k,v])=>`<option value="${k}">${v.label} · ${v.sub}</option>`).join(""));
}

/* ---------- events ---------- */
function initEvents(){
  document.querySelectorAll(".step-btn").forEach(b=>{
    b.addEventListener("click",()=>{
      const dir = Number(b.dataset.dir);
      if(b.dataset.target==="month") state.month = Math.min(12, Math.max(1, state.month+dir));
      else state.days = Math.min(30, Math.max(1, state.days+dir));
      render();
    });
  });
  $("#monthInput").addEventListener("input",e=>{
    const v = parseInt(e.target.value,10);
    if(v>=1 && v<=12){ state.month = v; render(); }
  });
  $("#monthInput").addEventListener("blur",e=>{ e.target.value = state.month; });
  $("#daysInput").addEventListener("input",e=>{
    const v = parseInt(e.target.value,10);
    if(v>=1 && v<=30){ state.days = v; render(); }
  });
  $("#daysInput").addEventListener("blur",e=>{ e.target.value = state.days; });
  $("#moodSelect").addEventListener("change",e=>{
    state.mood = e.target.value;
    render(false);
  });
  $("#goBtn").addEventListener("click",()=>render(true));

  const luckyDialog = $("#luckyDialog");
  const posterDialog = $("#posterDialog");
  const roll = ()=>{
    const d = DESTS[Math.floor(Math.random()*DESTS.length)];
    luckyD = d;
    $("#luckyTitle").textContent = d.n;
    $("#luckyRegion").textContent = d.r;
    $("#luckyDesc").textContent = d.x;
    $("#luckyMeta").innerHTML = `
      <div class="meta-row"><i data-lucide="calendar-days" aria-hidden="true"></i>最佳月份：${fmtMonths(d.m)}</div>
      <div class="meta-row"><i data-lucide="clock" aria-hidden="true"></i>建议停留：${fmtDays(d.d)}</div>
      <div class="pill-row">${d.md.map(k=>`<span class="pill pill-${k}">${MOODS[k].label}</span>`).join("")}</div>`;
    refreshIcons();
  };

  const openCardPoster = card => {
    const d = DESTS.find(item => item.n === card.dataset.name);
    if(d && showPoster(d,"card")) openDialog(posterDialog);
  };
  $("#resultCards").addEventListener("click",e=>{
    const card = e.target.closest(".card");
    if(card) openCardPoster(card);
  });
  $("#resultCards").addEventListener("keydown",e=>{
    if(e.key!=="Enter" && e.key!==" ") return;
    const card = e.target.closest(".card");
    if(card){ e.preventDefault(); openCardPoster(card); }
  });

  $("#luckyBtn").addEventListener("click",()=>{ roll(); openDialog(luckyDialog); });
  $("#luckyAgain").addEventListener("click",roll);
  $("#luckyOk").addEventListener("click",()=>{
    if(showPoster(luckyD,"lucky")){
      closeDialog(luckyDialog);
      openDialog(posterDialog);
    }
  });
  $("#luckyClose").addEventListener("click",()=>closeDialog(luckyDialog));
  $("#posterClose").addEventListener("click",()=>closeDialog(posterDialog));
  $("#posterBack").addEventListener("click",()=>{
    closeDialog(posterDialog);
    if(posterSource==="lucky") openDialog(luckyDialog);
  });
  $("#posterDownload").addEventListener("click",downloadPoster);
}

/* ---------- boot ---------- */
function init(){
  buildMoodOptions();
  initEvents();
  render();
  refreshIcons();
}
document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
