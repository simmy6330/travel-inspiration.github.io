<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>旅行灵感罗盘</title>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
<style>
:root{
  --bg:#F5F5FB;
  --surface:#FFFFFF;
  --ink:#1F2133;
  --muted:#6E7186;
  --line:#E6E5F2;
  --line-strong:#D7D6EA;
  --primary:#5B57D8;
  --primary-deep:#3A37A6;
  --accent:#8B5CF6;
  --tint:#F2F1FA;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.65;font-size:14px;
  -webkit-tap-highlight-color:transparent;
}
.wrap{width:100%;min-width:0;max-width:1080px;margin:0 auto;padding:0 20px}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}

/* ---------- header ---------- */
.app-header{
  background:
    linear-gradient(120deg,rgba(30,30,94,.82),rgba(91,87,216,.62)),
    url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=80")
    center / cover no-repeat,
    var(--primary-deep);
  color:#fff;
  height:100vh;
  height:100svh;
  height:100dvh;
  display:flex;
  padding:max(24px,env(safe-area-inset-top)) 0 max(28px,env(safe-area-inset-bottom));
}
.header-shell{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0}
.brand-row{
  display:flex;align-items:center;justify-content:center;flex-wrap:wrap;
  padding-top:clamp(28px,7vh,84px);
}
.brand{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0;text-align:center}
.brand-mark{
  width:46px;height:46px;flex:0 0 46px;border-radius:8px;
  background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;
}
.brand-mark svg{width:24px;height:24px}
.brand h1{font-size:22px;font-weight:700;letter-spacing:0}
.brand .tagline{font-size:13px;color:rgba(255,255,255,.78);margin-top:clamp(32px,6vh,60px)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border-radius:8px;padding:10px 18px;font-weight:600;font-size:14px;
  transition:transform .12s ease,box-shadow .12s ease,background .12s ease;
  white-space:nowrap;
}
.btn svg{width:16px;height:16px}
.btn:active{transform:scale(.97)}
.btn-light{background:#fff;color:var(--primary-deep)}
.btn-light:hover{box-shadow:0 6px 16px rgba(0,0,0,.18)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:#4A45C7}
.btn-ghost{border:1px solid var(--line-strong);background:#fff;color:var(--ink)}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
/* ---------- query card ---------- */
.hero-query{flex:1;min-height:0;min-width:0;display:flex;align-items:center;padding:clamp(20px,4vh,52px) 0}
.query-bar{
  display:flex;align-items:center;align-content:center;gap:16px;flex-wrap:wrap;
  width:100%;min-width:0;min-height:min(480px,58vh);min-height:min(480px,58svh);
  max-height:calc(100vh - 150px);max-height:calc(100svh - 150px);
  overflow:auto;-webkit-overflow-scrolling:touch;
  background:rgba(255,255,255,.96);border:1px solid rgba(255,255,255,.72);border-radius:8px;
  padding:clamp(22px,3.2vh,34px) clamp(20px,3vw,40px);
  box-shadow:0 24px 70px rgba(12,16,48,.26);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
}
.q-group{display:flex;align-items:center;gap:8px}
.q-label{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:var(--muted)}
.q-label svg{width:14px;height:14px;color:var(--primary)}
.query-bar .btn{padding:7px 16px;height:32px}
.query-control{display:inline-flex;align-items:center;gap:6px;min-width:0}
.step-btn{
  width:32px;height:32px;border:1px solid var(--line);border-radius:8px;background:#fff;
  display:inline-flex;align-items:center;justify-content:center;color:var(--muted);
  transition:border-color .12s ease,color .12s ease;
}
.step-btn:hover{border-color:var(--primary);color:var(--primary)}
.step-btn svg{width:14px;height:14px}
.num-input{
  width:64px;height:32px;text-align:center;border:1px solid var(--line);border-radius:8px;
  font-size:14px;font-weight:700;color:var(--ink);background:#fff;
}
.num-input:focus{outline:2px solid var(--primary);outline-offset:1px;border-color:var(--primary)}
.num-input::-webkit-outer-spin-button,.num-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.num-input{-moz-appearance:textfield;appearance:textfield}
.unit{font-size:13px;font-weight:600;color:var(--muted);margin-right:2px}
.mood-select{
  height:32px;border:1px solid var(--line);border-radius:8px;padding:0 10px;
  font-size:13.5px;font-weight:600;background:#fff;color:var(--ink);min-width:210px;
}
.origin-input{
  height:32px;border:1px solid var(--line);border-radius:8px;padding:0 10px;
  font-size:13.5px;font-weight:600;background:#fff;color:var(--ink);
  width:150px;min-width:0;
}
.origin-input:focus{outline:2px solid var(--primary);outline-offset:1px;border-color:var(--primary)}
.mood-select:focus{outline:2px solid var(--primary);outline-offset:1px;border-color:var(--primary)}
.query-bar .count-pill{margin-left:auto}
.scope-btn{
  height:32px;border:1px solid var(--line);background:#fff;color:var(--muted);
  padding:0 13px;font-size:13px;font-weight:700;
}
.scope-btn:first-child{border-radius:8px 0 0 8px}
.scope-btn:last-child{border-radius:0 8px 8px 0;margin-left:-1px}
.scope-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}
.scope-btn:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
#luckyQueryBtn{
  height:48px;padding:12px 28px;font-size:15px;
  margin-top:clamp(12px,2.5vh,26px);
}

/* ---------- results ---------- */
.result-head{
  display:flex;align-items:flex-end;justify-content:space-between;gap:14px;
  margin:18px 2px 14px;flex-wrap:wrap;
}
.result-head h2{font-size:19px;font-weight:700;letter-spacing:0}
.result-head .sub{font-size:13px;color:var(--muted);margin-top:2px}
.count-pill{
  background:var(--tint);border-radius:999px;padding:5px 13px;
  font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap;
}
.count-pill b{color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;padding-bottom:8px}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:8px;
  padding:16px 16px 14px;display:flex;flex-direction:column;gap:10px;
  border-top:3px solid var(--acc,var(--primary));
  transition:transform .14s ease,box-shadow .14s ease,border-color .14s ease;
  cursor:pointer;
}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(31,33,51,.08);border-color:var(--line-strong)}
.card:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.card h3{font-size:17px;font-weight:700;line-height:1.35}
.region{font-size:12.5px;color:var(--muted);margin-top:1px}
.badge{flex:none;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 10px}
.badge.hot{background:#EDE9FD;color:#6639C7}
.badge.soft{background:#F0EFEA;color:var(--muted)}
.desc{font-size:13.5px;color:var(--ink)}
.reason{
  display:flex;gap:8px;align-items:flex-start;background:var(--tint);
  border-left:3px solid var(--accent);border-radius:6px;padding:9px 11px;
  font-size:12.5px;color:#57606A;line-height:1.55;
}
.reason svg{width:14px;height:14px;flex:none;color:var(--accent);margin-top:3px}
.meta{display:flex;flex-direction:column;gap:6px;margin-top:auto;padding-top:2px}
.meta-row{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.meta-row svg{width:14px;height:14px;flex:none}
.pill-row{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:11px;font-weight:600;border-radius:999px;padding:2px 9px}
.pill-relax{background:#E7F3EC;color:#1E6B45}
.pill-heal{background:#E3F2F0;color:#0F6B62}
.pill-romance{background:#FBE7EC;color:#B0325B}
.pill-adventure{background:#FDEEE0;color:#A4530F}
.pill-food{background:#FBE9E7;color:#B3271A}
.pill-culture{background:#FBF3DE;color:#8A5B0C}
.pill-family{background:#E7F0FB;color:#1E5AA8}
.pill-photo{background:#EFEAFB;color:#5B3FA8}
.pill-shopping{background:#F9E8F5;color:#A02A85}
.empty{
  grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 10px;
  background:var(--surface);border:1px dashed var(--line-strong);border-radius:8px;
}

/* ---------- lucky dialog ---------- */
dialog{
  position:fixed;inset:0;margin:auto;height:fit-content;max-height:calc(100vh - 40px);overflow:auto;
  border:none;border-radius:8px;padding:0;width:min(440px,calc(100vw - 40px));
  box-shadow:0 24px 60px rgba(15,25,30,.3);
}
dialog::backdrop{background:rgba(20,24,28,.48)}
.lucky{padding:22px 22px 20px;display:flex;flex-direction:column;gap:12px;border-top:5px solid var(--accent)}
.lucky-top{display:flex;align-items:center;justify-content:space-between}
.lucky-kicker{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.08em}
.top-actions{display:flex;align-items:center;gap:4px}
.icon-btn{
  width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  color:var(--muted);transition:background .12s ease,color .12s ease;
}
.icon-btn:hover{background:var(--tint);color:var(--ink)}
.icon-btn svg{width:16px;height:16px}
.lucky h3{font-size:24px;font-weight:800;line-height:1.3}
.lucky .desc{font-size:14px}
.lucky-meta{display:flex;flex-direction:column;gap:8px;background:var(--tint);border-radius:8px;padding:12px 14px}
.lucky-actions{
  display:flex;align-items:center;gap:10px;justify-content:space-between;
  flex-wrap:wrap;margin-top:2px;
}
.lucky-action-group{display:flex;align-items:center;gap:10px;margin-left:auto;flex-wrap:wrap}
.poster{padding:18px;display:flex;flex-direction:column;gap:14px;border-top:5px solid var(--accent)}
.poster-frame{border-radius:8px;overflow:hidden;background:#15164D;box-shadow:0 10px 26px rgba(31,33,51,.18)}
#posterImage{display:block;width:100%;height:auto}
.poster-actions{display:flex;gap:10px;justify-content:flex-end}

footer{padding:0;text-align:center;font-size:12px;line-height:1.8;color:rgba(255,255,255,.72)}

@media (max-width:640px){
  .app-header{padding:max(16px,env(safe-area-inset-top)) 0 max(20px,env(safe-area-inset-bottom))}
  .header-shell{justify-content:flex-start}
  .brand-row{padding-top:clamp(24px,5vh,48px)}
  .brand h1{font-size:20px}
  .brand .tagline{font-size:12px}
  .brand-mark{width:42px;height:42px;flex-basis:42px}
  .hero-query{padding:18px 0 8px;align-items:center}
  .query-bar{
    height:min(100%,420px);min-height:0;max-height:none;
    padding:16px 14px;gap:10px;border-radius:8px;
  }
  .q-group{width:100%}
  .q-label{width:72px;flex:0 0 72px;font-size:12px}
  .query-control{flex:1;justify-content:flex-start}
  .query-bar .btn{width:100%}
  .step-btn,.num-input,.mood-select,.origin-input,.scope-btn{height:38px}
  .step-btn{width:38px}
  .scope-btn{font-size:14px}
  .mood-select{flex:1;min-width:0}
  .origin-input{width:100%;flex:1}
  .scope-btn{flex:1}
#luckyQueryBtn{height:50px;margin-top:12px}
  dialog{width:min(440px,calc(100vw - 24px));max-height:calc(100svh - 24px)}
}
@media (max-width:640px) and (max-height:620px){
  .app-header{padding:max(12px,env(safe-area-inset-top)) 0 max(12px,env(safe-area-inset-bottom))}
  .brand-row{padding-top:12px}
  .brand{gap:8px}
  .brand-mark{width:34px;height:34px;flex-basis:34px}
  .brand-mark svg{width:18px;height:18px}
  .brand h1{font-size:18px;line-height:1.4}
  .brand .tagline{font-size:11px;line-height:1.5;margin-top:14px}
  .hero-query{padding:10px 0 6px}
  .query-bar{height:min(100%,420px);padding:14px 12px;gap:8px}
  .step-btn,.num-input,.mood-select,.origin-input,.scope-btn{height:36px}
  .step-btn{width:36px}
  #luckyQueryBtn{height:46px;margin-top:10px;padding:10px 24px;font-size:14px}
  footer{font-size:11px;line-height:1.6}
}
@media (max-width:420px){
  .lucky-actions{align-items:flex-start}
  .lucky-actions .btn{padding:9px 10px;font-size:13px;gap:5px}
  .lucky-actions .btn svg{width:14px;height:14px}
  .poster-actions{flex-direction:column}
  .poster-actions .btn{width:100%}
}
@media (max-width:900px) and (max-height:520px){
  .brand .tagline{display:none}
  .brand-mark{width:36px;height:36px;flex-basis:36px}
  .hero-query{padding:12px 0}
  .query-bar{min-height:0;max-height:calc(100svh - 92px);padding:12px}
  #luckyQueryBtn{height:40px;margin-top:8px;padding:9px 20px}
}
</style>
</head>
<body>

<header class="app-header">
  <div class="wrap header-shell">
    <div class="brand-row">
      <div class="brand">
        <div class="brand-mark"><i data-lucide="compass" aria-hidden="true"></i></div>
        <div>
          <h1>旅行灵感罗盘</h1>
          <p class="tagline">当你不知道下一站去哪的时候，<br>让我给你推荐下一个目的地</p>
        </div>
      </div>
    </div>
    <div class="hero-query">
  <div class="query-bar">
    <div class="q-group">
      <span class="q-label"><i data-lucide="map-pin" aria-hidden="true"></i>我在</span>
      <div class="query-control">
        <input class="origin-input" id="originInput" type="text" list="originOptions" placeholder="城市 / 省份" aria-label="所在位置">
      </div>
    </div>
    <div class="q-group">
      <span class="q-label"><i data-lucide="calendar-days" aria-hidden="true"></i>月份</span>
      <div class="query-control">
        <button class="step-btn" data-target="month" data-dir="-1" aria-label="上一个月"><i data-lucide="minus" aria-hidden="true"></i></button>
        <input class="num-input" id="monthInput" type="number" inputmode="numeric" min="1" max="12" aria-label="出行月份">
        <span class="unit">月</span>
        <button class="step-btn" data-target="month" data-dir="1" aria-label="下一个月"><i data-lucide="plus" aria-hidden="true"></i></button>
      </div>
    </div>
    <div class="q-group">
      <span class="q-label"><i data-lucide="heart" aria-hidden="true"></i>心情</span>
      <div class="query-control">
        <select class="mood-select" id="moodSelect" aria-label="旅行心情">
          <option value="">不限心情</option>
        </select>
      </div>
    </div>
    <div class="q-group">
      <span class="q-label"><i data-lucide="clock" aria-hidden="true"></i>假期</span>
      <div class="query-control">
        <button class="step-btn" data-target="days" data-dir="-1" aria-label="减少一天"><i data-lucide="minus" aria-hidden="true"></i></button>
        <input class="num-input" id="daysInput" type="number" inputmode="numeric" min="1" max="30" aria-label="假期天数">
        <span class="unit">天</span>
        <button class="step-btn" data-target="days" data-dir="1" aria-label="增加一天"><i data-lucide="plus" aria-hidden="true"></i></button>
      </div>
    </div>
    <div class="q-group">
      <span class="q-label"><i data-lucide="globe" aria-hidden="true"></i>国内外</span>
      <div class="query-control" role="group" aria-label="目的地范围">
        <button type="button" class="scope-btn active" data-scope="国内">国内</button>
        <button type="button" class="scope-btn" data-scope="出境">国外</button>
      </div>
    </div>
    <button class="btn btn-primary" id="luckyQueryBtn"><i data-lucide="dices" aria-hidden="true"></i>手气目的地</button>
  </div>
      <datalist id="originOptions">
    <option value="北京"></option><option value="上海"></option><option value="广州"></option>
    <option value="深圳"></option><option value="杭州"></option><option value="成都"></option>
    <option value="重庆"></option><option value="西安"></option><option value="武汉"></option>
    <option value="南京"></option><option value="天津"></option><option value="苏州"></option>
    <option value="长沙"></option><option value="郑州"></option><option value="青岛"></option>
    <option value="沈阳"></option><option value="大连"></option><option value="哈尔滨"></option>
    <option value="昆明"></option><option value="乌鲁木齐"></option><option value="兰州"></option>
      </datalist>
    </div>
    <footer>纯娱乐版：推荐与心灵寄语仅供旅行灵感参考，<br>出行前请自行确认天气、开放时间与签证政策。</footer>
  </div>
</header>

<dialog id="luckyDialog" aria-labelledby="luckyTitle">
  <div class="lucky">
    <div class="lucky-top">
      <span class="lucky-kicker">下一个目的地</span>
      <div class="top-actions">
        <button class="icon-btn" id="luckyClose" aria-label="关闭" title="关闭"><i data-lucide="x" aria-hidden="true"></i></button>
      </div>
    </div>
    <h3 id="luckyTitle"></h3>
    <p class="region" id="luckyRegion"></p>
    <p class="desc" id="luckyDesc"></p>
    <div class="lucky-meta" id="luckyMeta"></div>
    <div class="lucky-actions">
      <button class="btn btn-primary" id="luckyBack"><i data-lucide="arrow-left" aria-hidden="true"></i>返回</button>
      <div class="lucky-action-group">
        <button class="btn btn-ghost" id="luckyAgain"><i data-lucide="dices" aria-hidden="true"></i>再来一次</button>
        <button class="btn btn-primary" id="luckyPosterBtn"><i data-lucide="image" aria-hidden="true"></i>保存灵感</button>
      </div>
    </div>
  </div>
</dialog>

<dialog id="posterDialog" aria-labelledby="posterDialogTitle">
  <div class="poster">
    <div class="lucky-top">
      <span class="lucky-kicker" id="posterDialogTitle">灵感卡片</span>
      <button class="icon-btn" id="posterClose" aria-label="关闭"><i data-lucide="x" aria-hidden="true"></i></button>
    </div>
    <div class="poster-frame">
      <img id="posterImage" alt="旅行灵感图片">
    </div>
    <div class="poster-actions">
      <button class="btn btn-ghost" id="posterBack"><i data-lucide="arrow-left" aria-hidden="true"></i>返回</button>
      <button class="btn btn-primary" id="posterDownload"><i data-lucide="download" aria-hidden="true"></i>保存图片</button>
    </div>
  </div>
</dialog>

<script>
"use strict";

const MOODS = {
  relax:    {label:"放松",  icon:"armchair",    sub:"躺平充电，什么都不想"},
  heal:     {label:"疗愈",  icon:"sprout",      sub:"离开内耗，把自己找回来"},
  romance:  {label:"浪漫",  icon:"heart",       sub:"二人世界，纪念日和心动"},
  adventure:{label:"冒险",  icon:"mountain",    sub:"上山下海，来点刺激的"},
  food:     {label:"美食",  icon:"utensils",    sub:"为了一口吃的出发"},
  culture:  {label:"文化",  icon:"landmark",    sub:"历史古城，看馆看窟"},
  family:   {label:"亲子",  icon:"baby",        sub:"遛娃友好，全家都开心"},
  photo:    {label:"拍照",  icon:"camera",      sub:"出片圣地，张张是大片"},
  shopping: {label:"购物",  icon:"shopping-bag",sub:"逛吃逛买，扫货回血"}
};
const MOOD_COLOR = {
  relax:"#2C8A5E", heal:"#0E7C6B", romance:"#C2417A", adventure:"#C96A1F",
  food:"#BE3A2B", culture:"#9A6B12", family:"#2E6DB4", photo:"#6D4FC4", shopping:"#B0358F"
};
const MOOD_QUOTES = {
  relax:["允许自己慢下来，风景才有机会走近你。","不赶路，也是一种抵达。"],

function fmtMonths(months){
  const a = [...new Set(months)].sort((x,y)=>x-y);
  const parts = []; let s = a[0], prev = a[0];
  for (let i=1;i<=a.length;i++){
    if (a[i]===prev+1){ prev=a[i]; continue; }
    parts.push(s===prev ? `${s}月` : `${s}-${prev}月`);
    s = prev = a[i];
  }
  return parts.join("、");
}

}

function wrapText(ctx,text,maxWidth,maxLines){
  const lines=[]; let line="";
  for(const ch of String(text)){
    if(line && ctx.measureText(line+ch).width>maxWidth){
      lines.push(line); line=ch;
    } else line += ch;
  }
  if(line) lines.push(line);
  if(lines.length>maxLines){
    lines.length=maxLines;
    let last=lines[maxLines-1];
    while(last.length>1 && ctx.measureText(last+"...").width>maxWidth) last=last.slice(0,-1);
    lines[maxLines-1]=last+"...";
  }
  return lines;
}
function drawTextBlock(ctx,text,x,y,maxWidth,lineHeight,maxLines,font,color){
  ctx.font=font; ctx.fillStyle=color; ctx.textAlign="left"; ctx.textBaseline="alphabetic";
  const lines=wrapText(ctx,text,maxWidth,maxLines);
  lines.forEach((row,i)=>ctx.fillText(row,x,y+i*lineHeight));
  return y+lineHeight*lines.length;
}
function roundedRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

/* ---------- combined scoring ---------- */
function normalizeOrigin(value){
  const raw=String(value||"").replace(/[\s　]+/g,"");
  if(!raw) return "";
  const aliases={"新疆维吾尔":"新疆","广西壮族":"广西","宁夏回族":"宁夏"};
  let compact=raw;
  for(const [alias,name] of Object.entries(aliases)){
    if(compact.includes(alias)) compact=compact.replace(alias,name);
  }
  for(const suffix of ["特别行政区","自治区","省","市"]){
    if(compact.endsWith(suffix)){
      compact=compact.slice(0,-suffix.length);
      break;
    }
  }
  if(Object.prototype.hasOwnProperty.call(ORIGIN_POINTS,compact)) return compact;
  const matches=Object.keys(ORIGIN_POINTS)
    .filter(name=>raw.includes(name)||compact.includes(name))
    .sort((a,b)=>b.length-a.length);
  return matches[0]||"";
}
function originInfo(){
  const raw=state.origin.trim();
  const name=normalizeOrigin(raw);
  return {raw,name,recognized:Boolean(name),point:name?ORIGIN_POINTS[name]:null};
}
function distanceKm(a,b){
  const rad=Math.PI/180;
  const dLat=(b[1]-a[1])*rad;
  const dLon=(b[0]-a[0])*rad;
  const lat1=a[1]*rad, lat2=b[1]*rad;
  const h=Math.sin(dLat/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;
  return Math.round(6371*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h)));
}
function roundTripDays(d,distance){
  if(d.a!=="出境"){
    if(distance<=300) return .5;
    if(distance<=800) return 1;
    if(distance<=1500) return 1.5;
    if(distance<=2500) return 2;
    if(distance<=3500) return 2.5;
    return 3;
  }
  if(distance<=2500) return 1.5;
  if(distance<=5000) return 2;
  if(distance<=8000) return 2.5;
  return 3;
}
function travelInfo(d){
  const origin=originInfo();
  if(!origin.recognized) return {known:false,name:origin.raw,distance:0,roundTrip:0,localDays:state.days};
  const point=DEST_POINTS[d.n];
  const distance=point?distanceKm(origin.point,point):0;
  const roundTrip=roundTripDays(d,distance);
  return {known:true,name:origin.name,distance,roundTrip,localDays:Math.max(.5,state.days-roundTrip)};
}
function fmtHalfDay(v){ return `${v}天`; }
function nearbyList(d){
  const extra=travelInfo(d).localDays-d.d[1];
  if(extra<6) return [];
  const pool=NEARBY[d.n]||[];
  const count=extra>=13?3:extra>=9?2:1;
  return pool.slice(0,Math.min(count,pool.length));
}
function durationScore(d){
  const lo=d.d[0], hi=d.d[1], localDays=travelInfo(d).localDays;
  if(localDays>=lo && localDays<=hi) return 7;
  return localDays>hi ? 7*hi/localDays : 7*localDays/lo;
}
function originScore(d){
  const info=travelInfo(d);
  if(!info.known) return 0;
  if(info.roundTrip<=.5) return 2;
  if(info.roundTrip<=1) return 1.7;
  if(info.roundTrip<=1.5) return 1.4;
  if(info.roundTrip<=2) return 1.1;
  if(info.roundTrip<=2.5) return .8;
  return .5;
}
function scoreFor(d){
  const mo=d.p.includes(state.month)?3:d.m.includes(state.month)?2:0;
  const g=state.mood?(d.md[0]===state.mood?3:d.md.includes(state.mood)?2:0):0;
  const dy=durationScore(d);
  const oc=originScore(d);
  return {t:mo+g+dy+oc,mo,g,dy,oc};
}
function isOriginPlace(d){
  const origin=originInfo();
  return origin.recognized && d.n===origin.name;
}
function recommend(){
  const hasOrigin=originInfo().recognized;
  const maxPts=state.mood?(hasOrigin?15:13):(hasOrigin?12:10);
  const domesticFirst=state.area==="国内"&&state.days<=5;
  return DESTS.filter(d=>state.area===d.a&&!isOriginPlace(d))
    .map(d=>({d,s:scoreFor(d)}))
    .sort((a,b)=>{
      if(domesticFirst){
        const areaA=a.d.a==="国内"?0:1;
        const areaB=b.d.a==="国内"?0:1;
        if(areaA!==areaB) return areaA-areaB;
      }
      return b.s.t-a.s.t||b.s.dy-a.s.dy||b.s.mo-a.s.mo||b.s.g-a.s.g||b.s.oc-a.s.oc;
    })
    .slice(0,9)
    .map(x=>({d:x.d,s:x.s,pct:Math.round(x.s.t/maxPts*20)*5}));
}

function reasonFor(d){

  else if(d.m.includes(m)) pts.push(`${m}月气候合适`);
  const k = state.mood;
  if(k){
    if(d.md[0]===k) pts.push(`「${MOODS[k].label}」是这里的招牌体验`);
    else if(d.md.includes(k)) pts.push(`也很适合「${MOODS[k].label}」`);
  }
  const travel=travelInfo(d);
  const n = travel.localDays;
  const nearby=nearbyList(d);
  if(travel.known) pts.push(`从${travel.name}出发扣往返约${fmtHalfDay(travel.roundTrip)}，当地约${fmtHalfDay(n)}`);
  if(n>=d.d[0] && n<=d.d[1]) pts.push(`当地${fmtHalfDay(n)}节奏刚好`);
  else if(n>d.d[1]) pts.push(
    nearby.length
      ? `当地${fmtHalfDay(n)}适合${d.d[1]}天主线，再串${nearby.join("、")}`
      : n-d.d[1]>=6 ? `当地${fmtHalfDay(n)}适合以这里作${d.d[1]}天主线` : `当地${fmtHalfDay(n)}可以玩得更从容`
  );
  else pts.push(`当地${fmtHalfDay(n)}是紧凑版，比理想少${fmtHalfDay(d.d[0]-n)}`);
  if(!pts.length) pts.push("作为这个组合的备选灵感");
  return pts.join("；");
}
function stayAdvice(d){
  const lo=d.d[0], hi=d.d[1], travel=travelInfo(d), n=travel.localDays;
  if(n<lo) return `当地${fmtHalfDay(n)}紧凑版（理想${fmtDays(d.d)}）`;
  if(n<=hi) return `当地${fmtHalfDay(n)}`;
  const nearby=nearbyList(d);
  if(nearby.length) return `${hi}天主线，再串${nearby.join("、")}`;
  return n-hi>=6 ? `${hi}天核心` : `${hi}天核心，可慢慢延伸`;
}
function originStatusText(){
  const origin=originInfo();
  if(!origin.raw) return "尚未填写出发地，建议停留按总假期估算";
  if(!origin.recognized) return `未能识别“${origin.raw}”，建议停留按总假期估算`;
  return `已从${origin.name}出发计算：先扣往返路程，再按当地可玩天数匹配`;
}
function originTravelText(d){
  const travel=travelInfo(d);
  if(!travel.known) return originStatusText();
  return `${travel.name}出发，往返约${fmtHalfDay(travel.roundTrip)}，当地约${fmtHalfDay(travel.localDays)}`;
}
function cardHTML(d, pct, top){
  const pills = d.md.map(k=>`<span class="pill pill-${k}">${MOODS[k].label}</span>`).join("");
  const badge = top
    ? '<span class="badge hot">综合推荐</span>'
    : `<span class="badge ${pct>=70?"hot":"soft"}">${pct}% 匹配</span>`;
  return `
  <article class="card" style="--acc:${MOOD_COLOR[d.md[0]]}" data-name="${d.n}" tabindex="0" role="button" aria-label="生成${d.n}旅行灵感图片">
    <div class="card-top">
      <div><h3>${d.n}</h3><p class="region">${d.r}</p></div>
      ${badge}
    </div>
    <p class="desc">${d.x}</p>
    <div class="reason"><i data-lucide="sparkles" aria-hidden="true"></i><span>匹配点：${reasonFor(d)}</span></div>
    <div class="meta">
      <div class="meta-row"><i data-lucide="calendar-days" aria-hidden="true"></i>最佳月份：${fmtMonths(d.m)}</div>
      <div class="meta-row"><i data-lucide="clock" aria-hidden="true"></i>建议停留：${stayAdvice(d)}</div>
      <div class="meta-row"><i data-lucide="map-pin" aria-hidden="true"></i>出发匹配：${originTravelText(d)}</div>
      <div class="pill-row">${pills}</div>
    </div>
  </article>`;
}
/* ---------- query sync ---------- */
function syncQuery(){
  $("#monthInput").value = state.month;
  $("#daysInput").value = state.days;
 document.querySelectorAll(".scope-btn").forEach(btn=>{
   btn.classList.toggle("active",btn.dataset.scope===state.area);
  });
}

function buildMoodOptions(){
  $("#moodSelect").insertAdjacentHTML("beforeend",
    Object.entries(MOODS).map(([k,v])=>`<option value="${k}">${v.label} · ${v.sub}</option>`).join(""));
}

/* ---------- events ---------- */
function initEvents(){
  document.querySelectorAll(".step-btn").forEach(b=>{
    b.addEventListener("click",()=>{
      const dir = Number(b.dataset.dir);
      if(b.dataset.target==="month") state.month = Math.min(12, Math.max(1, state.month+dir));
      else state.days = Math.min(30, Math.max(1, state.days+dir));
      syncQuery();
    });
  });
  $("#monthInput").addEventListener("input",e=>{
    const v = parseInt(e.target.value,10);
    if(v>=1 && v<=12){ state.month = v; syncQuery(); }
  });
  $("#monthInput").addEventListener("blur",e=>{ e.target.value = state.month; });
  $("#daysInput").addEventListener("input",e=>{
    const v = parseInt(e.target.value,10);
    if(v>=1 && v<=30){ state.days = v; syncQuery(); }
  });
  $("#daysInput").addEventListener("blur",e=>{ e.target.value = state.days; });
  $("#moodSelect").addEventListener("change",e=>{
    state.mood = e.target.value;
    syncQuery();
  });
  $("#originInput").addEventListener("input",e=>{
    state.origin=e.target.value;
    syncQuery();
  });
  $("#originInput").addEventListener("keydown",e=>{
    if(e.key==="Enter"){
      e.preventDefault();
      $("#luckyQueryBtn").click();
    }
  });
  $("#originInput").addEventListener("blur",e=>{
    const origin=originInfo();
    if(origin.recognized) e.target.value=origin.name;
  });
  document.querySelectorAll(".scope-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{
      state.area=btn.dataset.scope;
      syncQuery();
    });
  });

  const luckyDialog = $("#luckyDialog");
  const posterDialog = $("#posterDialog");
  const roll = ()=>{
    const pool=recommend();
    if(!pool.length) return;
    let d=pool[Math.floor(Math.random()*pool.length)].d;
    while(pool.length>1 && luckyD && d.n===luckyD.n){
      d=pool[Math.floor(Math.random()*pool.length)].d;
    }
    luckyD = d;
    $("#luckyTitle").textContent = d.n;
    $("#luckyRegion").textContent = d.r;
    $("#luckyDesc").textContent = d.x;
    $("#luckyMeta").innerHTML = `
      <div class="meta-row"><i data-lucide="globe" aria-hidden="true"></i>目的地范围：${state.area==="国内"?"国内":"国外"}</div>
      <div class="meta-row"><i data-lucide="calendar-days" aria-hidden="true"></i>最佳月份：${fmtMonths(d.m)}</div>
      <div class="meta-row"><i data-lucide="clock" aria-hidden="true"></i>建议停留：${stayAdvice(d)}</div>
      <div class="meta-row"><i data-lucide="map-pin" aria-hidden="true"></i>出发匹配：${originTravelText(d)}</div>
      <div class="pill-row">${d.md.map(k=>`<span class="pill pill-${k}">${MOODS[k].label}</span>`).join("")}</div>`;
    refreshIcons();
  };

  const openNextDestination = ()=>{
    roll();
    if(luckyD) openDialog(luckyDialog);
  };
  $("#luckyQueryBtn").addEventListener("click",openNextDestination);
  $("#luckyAgain").addEventListener("click",roll);
  $("#luckyBack").addEventListener("click",()=>{
    closeDialog(luckyDialog);
    $("#luckyQueryBtn").focus();
  });
  $("#luckyPosterBtn").addEventListener("click",()=>{
    if(showPoster(luckyD,"lucky")){
      closeDialog(luckyDialog);
      openDialog(posterDialog);
    }
  });
  $("#luckyClose").addEventListener("click",()=>closeDialog(luckyDialog));
  $("#posterClose").addEventListener("click",()=>closeDialog(posterDialog));
  $("#posterBack").addEventListener("click",()=>{
    closeDialog(posterDialog);
    if(posterSource==="lucky") openDialog(luckyDialog);
  });
  $("#posterDownload").addEventListener("click",downloadPoster);
}

/* ---------- boot ---------- */
function init(){
  buildMoodOptions();
  initEvents();
  syncQuery();
  refreshIcons();
}
init();
window.addEventListener("load",refreshIcons);
</script>
</body>
</html>
