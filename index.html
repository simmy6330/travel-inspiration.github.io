<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>旅行灵感罗盘</title>
<style>
:root{
  --bg:#F5F5FB;
  --surface:#FFFFFF;
  --ink:#1F2133;
  --muted:#6E7186;
  --line:#E6E5F2;
  --line-strong:#D7D6EA;
  --primary:#5B57D8;
  --primary-deep:#3A37A6;
  --accent:#8B5CF6;
  --tint:#F2F1FA;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
html{-webkit-text-size-adjust:100%}
html{touch-action:manipulation}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.65;font-size:14px;
  -webkit-tap-highlight-color:transparent;
}
.wrap{width:100%;min-width:0;max-width:1080px;margin:0 auto;padding:0 20px}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}

/* ---------- header ---------- */
.app-header{
  background:
    linear-gradient(120deg,rgba(30,30,94,.82),rgba(91,87,216,.62)),
    url("./scenery.jpg")
    center / cover no-repeat,
    var(--primary-deep);
  color:#fff;
  height:100vh;
  height:var(--app-height,100vh);
  height:100svh;
  height:100dvh;
  display:flex;
  padding:24px 0 28px;
  padding:max(24px,var(--safe-area-inset-top,env(safe-area-inset-top,0px))) 0 max(28px,var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)));
}
.header-shell{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0}
.brand-row{
  display:flex;align-items:center;justify-content:center;flex-wrap:wrap;
  padding-top:48px;
  padding-top:clamp(28px,7vh,84px);
}
.brand{display:flex;flex-direction:column;align-items:center;min-width:0;text-align:center}
.brand > * + *{margin-top:10px}
.brand-mark{
  width:46px;height:46px;flex:0 0 46px;border-radius:8px;
  background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;
}
.brand-mark svg{width:24px;height:24px}
.brand h1{font-size:22px;font-weight:700;letter-spacing:0}
.brand .tagline{font-size:13px;color:rgba(255,255,255,.78);margin-top:40px;margin-top:clamp(32px,6vh,60px)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  border-radius:8px;padding:10px 18px;font-weight:600;font-size:14px;
  transition:transform .12s ease,box-shadow .12s ease,background .12s ease;
  white-space:nowrap;
}
.btn svg{width:16px;height:16px;margin-right:8px}
.btn:active{transform:scale(.97)}
.btn-light{background:#fff;color:var(--primary-deep)}
.btn-light:hover{box-shadow:0 6px 16px rgba(0,0,0,.18)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:#4A45C7}
.btn-ghost{border:1px solid var(--line-strong);background:#fff;color:var(--ink)}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
/* ---------- query card ---------- */
.hero-query{flex:1;min-height:0;min-width:0;display:flex;align-items:center;padding:36px 0;padding:clamp(20px,4vh,52px) 0}
.query-bar{
  display:flex;align-items:center;align-content:center;flex-wrap:wrap;
  width:100%;min-width:0;min-height:480px;min-height:min(480px,58vh);min-height:min(480px,58svh);
  max-height:calc(100vh - 150px);max-height:calc(var(--app-height,100vh) - 150px);max-height:calc(100svh - 150px);
  overflow:auto;-webkit-overflow-scrolling:touch;
  background:rgba(255,255,255,.96);border:1px solid rgba(255,255,255,.72);border-radius:8px;
  padding:28px 30px;padding:clamp(22px,3.2vh,34px) clamp(20px,3vw,40px);
  box-shadow:0 24px 70px rgba(12,16,48,.26);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
}
.query-bar > * + *{margin-left:16px}
.q-group{display:flex;align-items:center}
.q-group > * + *{margin-left:8px}
.q-label{display:inline-flex;align-items:center;font-size:12.5px;font-weight:700;color:var(--muted)}
.q-label svg{width:14px;height:14px;color:var(--primary);margin-right:5px}
.query-bar .btn{padding:7px 16px;height:32px}
.query-control{display:inline-flex;align-items:center;min-width:0}
.query-control > * + *{margin-left:6px}
.step-btn{
  width:32px;height:32px;border:1px solid var(--line);border-radius:8px;background:#fff;
  display:inline-flex;align-items:center;justify-content:center;color:var(--muted);
  transition:border-color .12s ease,color .12s ease;
}
.step-btn:hover{border-color:var(--primary);color:var(--primary)}
.step-btn svg{width:14px;height:14px}
.num-input{
  width:64px;height:32px;text-align:center;border:1px solid var(--line);border-radius:8px;
  font-size:14px;font-weight:700;color:var(--ink);background:#fff;
}
.num-input:focus{outline:2px solid var(--primary);outline-offset:1px;border-color:var(--primary)}
.num-input::-webkit-outer-spin-button,.num-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.num-input{-moz-appearance:textfield;appearance:textfield}
.unit{font-size:13px;font-weight:600;color:var(--muted);margin-right:2px}
.mood-select{
  height:32px;border:1px solid var(--line);border-radius:8px;padding:0 10px;
  font-size:13.5px;font-weight:600;background:#fff;color:var(--ink);min-width:210px;
}
.origin-input{
  height:32px;border:1px solid var(--line);border-radius:8px;padding:0 10px;
  font-size:13.5px;font-weight:600;background:#fff;color:var(--ink);
  width:150px;min-width:0;
}
.origin-input:focus{outline:2px solid var(--primary);outline-offset:1px;border-color:var(--primary)}
.mood-select:focus{outline:2px solid var(--primary);outline-offset:1px;border-color:var(--primary)}
.query-bar .count-pill{margin-left:auto}
.scope-btn{
  height:32px;border:1px solid var(--line);background:#fff;color:var(--muted);
  padding:0 13px;font-size:13px;font-weight:700;
}
.scope-btn:first-child{border-radius:8px 0 0 8px}
.scope-btn:last-child{border-radius:0 8px 8px 0;margin-left:-1px}
.scope-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}
.scope-btn:focus,.scope-btn:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
#luckyQueryBtn{
  height:48px;padding:12px 28px;font-size:15px;
  margin-top:18px;margin-top:clamp(12px,2.5vh,26px);
}

/* ---------- results ---------- */
.result-head{
  display:flex;align-items:flex-end;justify-content:space-between;
  margin:18px 2px 14px;flex-wrap:wrap;
}
.result-head > * + *{margin-left:14px}
.result-head h2{font-size:19px;font-weight:700;letter-spacing:0}
.result-head .sub{font-size:13px;color:var(--muted);margin-top:2px}
.count-pill{
  background:var(--tint);border-radius:999px;padding:5px 13px;
  font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap;
}
.count-pill b{color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));grid-gap:14px;padding-bottom:8px}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:8px;
  padding:16px 16px 14px;display:flex;flex-direction:column;
  border-top:3px solid var(--acc,var(--primary));
  transition:transform .14s ease,box-shadow .14s ease,border-color .14s ease;
  cursor:pointer;
}
.card > * + *{margin-top:10px}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(31,33,51,.08);border-color:var(--line-strong)}
.card:focus,.card:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.card-top{display:flex;align-items:flex-start;justify-content:space-between}
.card-top > * + *{margin-left:10px}
.card h3{font-size:17px;font-weight:700;line-height:1.35}
.region{font-size:12.5px;color:var(--muted);margin-top:1px}
.badge{flex:none;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 10px}
.badge.hot{background:#EDE9FD;color:#6639C7}
.badge.soft{background:#F0EFEA;color:var(--muted)}
.desc{font-size:13.5px;color:var(--ink)}
.reason{
  display:flex;align-items:flex-start;background:var(--tint);
  border-left:3px solid var(--accent);border-radius:6px;padding:9px 11px;
  font-size:12.5px;color:#57606A;line-height:1.55;
}
.reason svg{width:14px;height:14px;flex:none;color:var(--accent);margin-top:3px;margin-right:8px}
.meta{display:flex;flex-direction:column;margin-top:auto;padding-top:2px}
.meta > * + *{margin-top:6px}
.meta-row{display:flex;align-items:center;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.meta-row svg{width:14px;height:14px;flex:none;margin-right:7px}
.pill-row{display:flex;flex-wrap:wrap}
.pill-row > * + *{margin-left:6px}
.pill{font-size:11px;font-weight:600;border-radius:999px;padding:2px 9px}
.pill-relax{background:#E7F3EC;color:#1E6B45}
.pill-heal{background:#E3F2F0;color:#0F6B62}
.pill-romance{background:#FBE7EC;color:#B0325B}
.pill-adventure{background:#FDEEE0;color:#A4530F}
.pill-food{background:#FBE9E7;color:#B3271A}
.pill-culture{background:#FBF3DE;color:#8A5B0C}
.pill-family{background:#E7F0FB;color:#1E5AA8}
.pill-photo{background:#EFEAFB;color:#5B3FA8}
.pill-shopping{background:#F9E8F5;color:#A02A85}
.empty{
  grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 10px;
  background:var(--surface);border:1px dashed var(--line-strong);border-radius:8px;
}

/* ---------- lucky dialog ---------- */
dialog{
  position:fixed;top:50%;left:50%;right:auto;bottom:auto;transform:translate(-50%,-50%);margin:0;height:auto;max-height:calc(100vh - 40px);overflow:auto;
  border:none;border-radius:8px;padding:0;width:440px;max-width:calc(100vw - 40px);width:min(440px,calc(100vw - 40px));
  box-shadow:0 24px 60px rgba(15,25,30,.3);
}
dialog:not([open]){display:none}
dialog[open]{display:block}
dialog::backdrop{background:rgba(20,24,28,.48)}
.lucky{padding:22px 22px 20px;display:flex;flex-direction:column;border-top:5px solid var(--accent)}
.lucky > * + *{margin-top:12px}
.lucky-top{display:flex;align-items:center;justify-content:space-between}
.lucky-kicker{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.08em}
.top-actions{display:flex;align-items:center}
.top-actions > * + *{margin-left:4px}
.icon-btn{
  width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  color:var(--muted);transition:background .12s ease,color .12s ease;
}
.icon-btn:hover{background:var(--tint);color:var(--ink)}
.icon-btn svg{width:16px;height:16px}
.lucky h3{font-size:24px;font-weight:800;line-height:1.3}
.lucky .desc{font-size:14px}
.lucky-meta{display:flex;flex-direction:column;background:var(--tint);border-radius:8px;padding:12px 14px}
.lucky-meta > * + *{margin-top:8px}
.lucky-actions{
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;margin-top:2px;
}
.lucky-actions > * + *{margin-left:10px}
.lucky-action-group{display:flex;align-items:center;margin-left:auto;flex-wrap:wrap}
.lucky-action-group > * + *{margin-left:10px}
.poster{padding:18px;display:flex;flex-direction:column;border-top:5px solid var(--accent)}
.poster > * + *{margin-top:14px}
.poster-frame{border-radius:8px;overflow:hidden;background:#15164D;box-shadow:0 10px 26px rgba(31,33,51,.18)}
#posterImage{display:block;width:100%;height:auto}
.poster-actions{display:flex;justify-content:flex-end}
.poster-actions > * + *{margin-left:10px}

footer{padding:0;text-align:center;font-size:12px;line-height:1.8;color:rgba(255,255,255,.72)}

@media (max-width:640px){
  .app-header{padding:16px 0 20px;padding:max(16px,var(--safe-area-inset-top,env(safe-area-inset-top,0px))) 0 max(20px,var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)))}
  .header-shell{justify-content:flex-start}
  .brand-row{padding-top:32px;padding-top:clamp(24px,5vh,48px)}
  .brand h1{font-size:20px}
  .brand .tagline{font-size:12px}
  .brand-mark{width:42px;height:42px;flex-basis:42px}
  .hero-query{padding:18px 0 8px;align-items:center}
  .query-bar{
    height:420px;max-height:100%;min-height:0;
    padding:16px 14px;border-radius:8px;
  }
  .query-bar > * + *{margin-left:0;margin-top:10px}
  .q-group{width:100%}
  .q-label{width:72px;flex:0 0 72px;font-size:12px}
  .query-control{flex:1;justify-content:flex-start}
  .query-bar .btn{width:100%}
  .step-btn,.num-input,.mood-select,.origin-input,.scope-btn{height:38px}
  .num-input,.mood-select,.origin-input{font-size:16px}
  .step-btn{width:38px}
  .scope-btn{font-size:14px}
  .mood-select{flex:1;min-width:0}
  .origin-input{width:100%;flex:1}
  .scope-btn{flex:1}
#luckyQueryBtn{height:50px;margin-top:12px}
  dialog{width:min(440px,calc(100vw - 24px));max-height:calc(100svh - 24px)}
}
@media (max-width:640px) and (max-height:620px){
  .app-header{padding:12px 0 12px;padding:max(12px,var(--safe-area-inset-top,env(safe-area-inset-top,0px))) 0 max(12px,var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)))}
  .brand-row{padding-top:12px}
  .brand > * + *{margin-top:8px}
  .brand-mark{width:34px;height:34px;flex-basis:34px}
  .brand-mark svg{width:18px;height:18px}
  .brand h1{font-size:18px;line-height:1.4}
  .brand .tagline{font-size:11px;line-height:1.5;margin-top:14px}
  .hero-query{padding:10px 0 6px}
  .query-bar{height:auto;max-height:100%;padding:14px 12px}
  .query-bar > * + *{margin-top:8px}
  .step-btn,.num-input,.mood-select,.origin-input,.scope-btn{height:36px}
  .step-btn{width:36px}
  #luckyQueryBtn{height:46px;margin-top:10px;padding:10px 24px;font-size:14px}
  footer{font-size:11px;line-height:1.6}
}
@media (max-width:420px){
  .lucky-actions{align-items:flex-start}
  .lucky-actions .btn{padding:9px 10px;font-size:13px}
  .lucky-actions .btn svg{margin-right:5px}
  .lucky-actions .btn svg{width:14px;height:14px}
  .poster-actions{flex-direction:column}
  .poster-actions .btn{width:100%}
}
@media (max-width:900px) and (max-height:520px){
  .brand .tagline{display:none}
  .brand-mark{width:36px;height:36px;flex-basis:36px}
  .hero-query{padding:12px 0}
  .query-bar{min-height:0;max-height:calc(100vh - 92px);max-height:calc(var(--app-height,100vh) - 92px);max-height:calc(100svh - 92px);padding:12px}
  #luckyQueryBtn{height:40px;margin-top:8px;padding:9px 20px}
}
</style>
</head>
<body>

<header class="app-header">
  <div class="wrap header-shell">
    <div class="brand-row">
      <div class="brand">
        <div class="brand-mark"><svg class="lucide" data-icon="compass" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m16.24 7.76-2.12 6.36-6.36 2.12 2.12-6.36 6.36-2.12z"/></svg></div>
        <div>
          <h1>旅行灵感罗盘</h1>
          <p class="tagline">当你不知道下一站去哪的时候，<br>让我给你推荐下一个目的地</p>
        </div>
      </div>
    </div>
    <div class="hero-query">
  <div class="query-bar">
    <div class="q-group">
      <span class="q-label"><svg class="lucide" data-icon="map-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>我在</span>
      <div class="query-control">
        <input class="origin-input" id="originInput" type="text" list="originOptions" placeholder="城市 / 省份" aria-label="所在位置" autocomplete="off">
      </div>
    </div>
    <div class="q-group">
      <span class="q-label"><svg class="lucide" data-icon="calendar-days" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"/></svg>月份</span>
      <div class="query-control">
        <button class="step-btn" data-target="month" data-dir="-1" aria-label="上一个月"><svg class="lucide" data-icon="minus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
        <input class="num-input" id="monthInput" type="number" inputmode="numeric" min="1" max="12" value="10" aria-label="出行月份">
        <span class="unit">月</span>
        <button class="step-btn" data-target="month" data-dir="1" aria-label="下一个月"><svg class="lucide" data-icon="plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
    </div>
    <div class="q-group">
      <span class="q-label"><svg class="lucide" data-icon="heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>心情</span>
      <div class="query-control">
        <select class="mood-select" id="moodSelect" aria-label="旅行心情">
          <option value="">不限心情</option>
        </select>
      </div>
    </div>
    <div class="q-group">
      <span class="q-label"><svg class="lucide" data-icon="clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 7v5l3 2"/></svg>假期</span>
      <div class="query-control">
        <button class="step-btn" data-target="days" data-dir="-1" aria-label="减少一天"><svg class="lucide" data-icon="minus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
        <input class="num-input" id="daysInput" type="number" inputmode="numeric" min="1" max="30" value="3" aria-label="假期天数">
        <span class="unit">天</span>
        <button class="step-btn" data-target="days" data-dir="1" aria-label="增加一天"><svg class="lucide" data-icon="plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
    </div>
    <div class="q-group">
      <span class="q-label"><svg class="lucide" data-icon="globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15 15 0 0 1 4 10 15 15 0 0 1-4 10 15 15 0 0 1-4-10 15 15 0 0 1 4-10z"/></svg>国内外</span>
      <div class="query-control" role="group" aria-label="目的地范围">
        <button type="button" class="scope-btn active" data-scope="国内">国内</button>
        <button type="button" class="scope-btn" data-scope="出境">国外</button>
      </div>
    </div>
    <button type="button" class="btn btn-primary" id="luckyQueryBtn"><svg class="lucide" data-icon="dices" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 9h.01M15 9h.01M9 15h.01M15 15h.01M12 12h.01"/></svg>手气目的地</button>
  </div>
      <datalist id="originOptions">
    <option value="北京"></option><option value="上海"></option><option value="广州"></option>
